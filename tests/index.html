<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpaceSwap core checks</title><style>body{font:15px system-ui;max-width:850px;margin:50px auto;padding:0 25px;background:#f7f7f2;color:#244b3b}li{padding:6px}pre{white-space:pre-wrap;color:#9d463e}a{color:inherit}</style></head><body><a href="/">← Back to SpaceSwap</a><h1>Core geometry & cost checks</h1><div id="results"></div><script type="module">import {runCoreTests} from './core.test.js';const el=document.querySelector('#results');try{const results=runCoreTests();el.innerHTML=`<h2>${results.length} checks passed</h2><ol>${results.map(name=>`<li>✓ ${name}</li>`).join('')}</ol>`;}catch(error){el.textContent=error.stack;el.style.color='#a34e40';throw error;}</script></body></html>
